[package]
name = "sym"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
description = "Always-fresh tree-sitter symbol index for AI coding agents: CLI and MCP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lapayrus/sym"
readme = "README.md"
keywords = ["tree-sitter", "mcp", "symbols", "code-search", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["bench/", "docs/", ".github/", "CLAUDE.md"]
# The crates.io name `sym` belongs to another project; releases ship as GitHub binaries.
publish = false

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
notify = "8.2.0"
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

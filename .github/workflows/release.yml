name: Release

# Push a tag `vX.Y.Z` matching `version` in Cargo.toml (see CONTRIBUTING.md, "Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        shell: bash
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sym-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/sym.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/sym" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "sym $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
